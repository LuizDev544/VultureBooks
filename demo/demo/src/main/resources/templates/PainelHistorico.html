<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria | Vulture Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Styles/Global.css">
</head>
<body>
    <div class="d-flex">
        
        <nav class="sidebar bg-dark text-white p-3 min-vh-100 d-flex flex-column" style="width: 240px;">
            <h4 class="text-center mb-4 border-bottom pb-3">Vulture Books</h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a href="/livros/cadastrar" class="nav-link text-white">
                        <i class="bi bi-plus-circle me-2"></i> Cadastrar Livro
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/livros/painel" class="nav-link text-white">
                        <i class="bi bi-table me-2"></i> Voltar ao Painel
                    </a>
                </li>
            </ul>
            <div class="mt-auto pt-5">
                <a href="/admin/login" class="btn btn-outline-light btn-sm w-100">Sair</a>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light">
            <div class="mb-4">
                <h2>Histórico de Auditoria (Decorator Pattern)</h2>
                <p class="text-muted">Ações interceptadas e registradas pela camada decoradora do sistema.</p>
            </div>
            
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID do Log</th>
                                    <th>Operação</th>
                                    <th>ID do Livro</th>
                                    <th>ID do Admin</th>
                                    <th>Data e Hora</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="h : ${historicos}">
                                    <td th:text="${h.id}"></td>
                                    <td>
                                        <span th:if="${h.acao == 'CRIAR'}" class="badge bg-success">Criação</span>
                                        <span th:if="${h.acao == 'ATUALIZAR'}" class="badge bg-warning text-dark">Edição</span>
                                    </td>
                                    <td th:text="${h.idLivro}"></td>
                                    <td th:text="${h.idAdmin != null ? h.idAdmin : 'N/A'}"></td>
                                    <td th:text="${#temporals.format(h.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                </tr>
                                
                                <tr th:if="${#lists.isEmpty(historicos)}">
                                    <td colspan="5" class="text-center text-muted py-4">
                                        Nenhum registro de histórico encontrado.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
